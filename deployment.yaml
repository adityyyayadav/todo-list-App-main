apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-main
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-main
  template:
    metadata:
      labels:
        app: app-main
    spec:
      containers:
        - name: app-main
          image: app-main:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
